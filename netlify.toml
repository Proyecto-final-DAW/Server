[build]
command = "npm run build"
publish = "."

[context.production]
command = "NODE_ENV=production npm run db:migrate && npm run build"

[functions]
directory = "netlify/functions"
node_bundler = "esbuild"

[[redirects]]
from = "/*"
to = "/.netlify/functions/api/:splat"
status = 200
force = true

