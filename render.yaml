# Render Blueprint — backend del proyecto (API Express + Postgres).
#
# La base de datos vive en Neon (externa a Render): la variable DATABASE_URL
# se configura a mano en el dashboard de Render (env var con `sync: false`),
# por eso este blueprint NO declara ningún recurso `databases:`.
#
# Render Blueprint spec: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: tfg-server
    runtime: node
    plan: free
    region: virginia # Misma región que la BD de Neon (AWS US East 1 / N. Virginia): backend y BD juntos = mínima latencia.
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    # `--prod=false` es obligatorio: NODE_ENV=production (más abajo) también
    # aplica durante el build, y haría que pnpm omitiese las devDependencies
    # (typescript/tsc, prisma, dbmate) que el build y las migraciones necesitan.
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm run build
    startCommand: pnpm run db:migrate && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      # PORT lo inyecta Render automáticamente — no hace falta declararlo.
      # TRUST_PROXY tampoco: app.ts detecta `process.env.RENDER` y activa
      # `trust proxy` solo (necesario para req.ip / rate-limit tras el proxy).
      - key: JWT_EXPIRES_IN
        value: 7d
      # Valores que se rellenan a mano en el dashboard de Render:
      - key: DATABASE_URL # cadena de conexión de Neon (incluye sslmode=require)
        sync: false
      - key: JWT_SECRET # secreto para firmar los JWT
        sync: false
      - key: CORS_ORIGIN # origen del front en Vercel, p. ej. https://tu-app.vercel.app
        sync: false
